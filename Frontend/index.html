<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Notes - Collaborative Markdown Notes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="page-top">
            <div>
                <h1>Collaborative Markdown Notes</h1>
                <p class="subtitle">Create, organize, and manage your notes in one place.</p>
            </div>

            <button
                type="button"
                id="viewBtn"
                onclick="window.location.href='savedNotes.html'">
                View Notes
            </button>
        </div>

        <section id="note-form" class="card">
            <div class="section-header">
                <h2>Create a Note</h2>
                <p>Write down your ideas and save them for later.</p>
            </div>

            <form id="notesForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="title">Note Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        required
                        placeholder="Enter note title">
                </div>

                <div class="form-group">
                    <label for="description">Note Content</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Write your note here using Markdown..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="saveBtn">Save Note</button>
                    <button type="button" id="cancelBtn" class="secondary-btn">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <footer>
            <p>&copy; Collaborative Markdown Notes. All rights reserved.</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
