<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Notes - Collaborative Markdown Notes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Collaborative Markdown Notes</h1>
            <nav>
                <section id="notes-section">
                    <button type="button" onclick="window.location.href='index.html'">Add New Note</button>
                </section>
            </nav>
        </div>
    </header>

    <main>
        <section id="notes-section">
            <header class="section-header">
                <h2>Saved Notes</h2>
            </header>

            <div class="action-bar">
                <button type="button" id="refreshBtn">Refresh Notes</button>
                <button type="button" onclick="window.location.href='index.html'">Add New Note</button>
            </div>

            <div id="notesList"></div>
        </section>

        <section id="edit-section" hidden>
            <header class="section-header">
                <h2>Update Note</h2>
            </header>

            <form id="editForm">
                <div class="form-group">
                    <label for="editName">Your Name:</label>
                    <input type="text" id="editName" required>
                </div>

                <div class="form-group">
                    <label for="editTitle">Note Title:</label>
                    <input type="text" id="editTitle" required>
                </div>

                <div class="form-group">
                    <label for="editDescription">Note Content:</label>
                    <textarea id="editDescription" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="updateBtn">Update Note</button>
                    <button type="button" id="cancelEditBtn">Cancel</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Collaborative Markdown Notes. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    <script src="savedNotes.js"></script>
</body>
</html>
