<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Notes - Collaborative Markdown Notes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="page-top">
            <div>
                <h1>Collaborative Markdown Notes</h1>
                <p class="subtitle">All your saved notes, organized in one place.</p>
            </div>

            <button
                type="button"
                onclick="window.location.href='index.html'">
                + Add New Note
            </button>
        </div>

        <section id="notes-section" class="card">
            <div class="section-header">
                <div>
                    <h2>Saved Notes</h2>
                    <p>View, edit, and manage your notes.</p>
                </div>

                <button type="button" id="refreshBtn" class="secondary-btn">
                    Refresh Notes
                </button>
            </div>

            <div id="notesList" class="notes-list"></div>
        </section>

        <section id="edit-section" class="card" hidden>
            <div class="section-header">
                <h2>Update Note</h2>
                <p>Make changes to your existing note.</p>
            </div>

            <form id="editForm">
                <div class="form-group">
                    <label for="editName">Your Name</label>
                    <input
                        type="text"
                        id="editName"
                        required
                        placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="editTitle">Note Title</label>
                    <input
                        type="text"
                        id="editTitle"
                        required
                        placeholder="Enter note title">
                </div>

                <div class="form-group">
                    <label for="editDescription">Note Content</label>
                    <textarea
                        id="editDescription"
                        required
                        placeholder="Update your note content"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="updateBtn">Update Note</button>
                    <button
                        type="button"
                        id="cancelEditBtn"
                        class="secondary-btn">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <footer>
            <p>&copy; Collaborative Markdown Notes. All rights reserved.</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    <script src="savedNotes.js"></script>
</body>
</html>
